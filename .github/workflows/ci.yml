# =============================================================================
# CI — the guards that catch what actually broke this repo.
# =============================================================================
# Runs on push and pull request, not workflow_dispatch alone: a workflow that
# only runs when somebody clicks it reports the last click rather than the
# state of main, and a commit that breaks the build leaves it looking fine.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  script-perms:
    name: Script Permissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every script with a shebang must be executable
        run: |
          # core.filemode is false on the Windows machine these are authored on,
          # so `chmod +x` is never recorded and every .sh here landed 100644.
          # The Makefile runs ./scripts/quickstart/wizard.sh, so the README's
          # first command failed outright on Linux and macOS:
          #
          #   make: ./scripts/quickstart/wizard.sh: Permission denied
          #
          # It worked for the author because MSYS ignores the bit. Invisible
          # where it is introduced, fatal everywhere else -- exactly the kind of
          # bug that comes back without a guard.
          bad=0
          while read -r mode _ _ path; do
            case "$mode" in 100755) continue ;; esac
            if head -1 "$path" 2>/dev/null | grep -q '^#!'; then
              echo "::error file=$path::has a shebang but is mode $mode - run: git update-index --chmod=+x $path"
              bad=1
            fi
          done < <(git ls-files -s '*.sh')
          [ "$bad" = 0 ] && echo "All shebang scripts are executable."
          exit "$bad"

  # ---------------------------------------------------------------------------
  # Same matrix the release gate uses. Contexts come from docker-compose.yml,
  # which is what the wizard actually runs.
  # ---------------------------------------------------------------------------
  docker-build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      # One failing image must not cancel the rest: fail-fast hides their real
      # state behind "cancelled", which costs an extra round trip per image.
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: Dockerfile
            context: .
          - image: web
            dockerfile: Dockerfile.web
            context: .
          - image: collaboration-server
            dockerfile: collaboration-server/Dockerfile
            context: collaboration-server
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: citra-decks-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
