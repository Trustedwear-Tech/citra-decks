[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "citra-llm"
version = "1.0.0"
description = "Unified LLM client factory (chat / embedding / vision / search). Single source of truth for LLM_BASE_URL/LLM_API_KEY/LLM_MODEL env-driven client creation, used by every service that talks to an LLM."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0,<2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["citra_llm*"]
