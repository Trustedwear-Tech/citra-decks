[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "citra-auth"
version = "1.1.0"
description = "Shared JWT auth middleware + claim helpers + token-revocation seam (jti blocklist). One source of truth used by Citra-Service, citra-workflow, smart-app-service, and any other FastAPI app that needs to verify Citra user JWTs. Replaces the previously-duplicated auth_middleware.py in Citra-Service that was being imported across services via PYTHONPATH."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "PyJWT>=2.8",
  "starlette>=0.36",
  "slowapi>=0.1.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["citra_auth*"]
